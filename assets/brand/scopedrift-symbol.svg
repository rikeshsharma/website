<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">scopedrift aperture mark</title>
  <desc id="desc">A warm terracotta circle containing a soft cream aperture with a calm center.</desc>
  <!-- Core mark: scope (the circular field), drift (the moving radial breaks), truth (the quiet center). -->
