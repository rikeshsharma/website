<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rikesh Sharma</title>
  <link rel="icon" href="assets/brand/scopedrift-symbol.ico" sizes="32x32">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="theme.css">
  <script defer src="script.js"></script>
</head>
<body>
  <header>
    <nav>
      <a href="#home" class="logo">
        <svg class="logo-image" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
          <title id="title">scopedrift aperture mark</title>
          <desc id="desc">A warm terracotta circle containing a soft cream aperture with a calm center.</desc>
          <!-- Core mark: scope (the circular field), drift (the moving radial breaks), truth (the quiet center). -->
          <circle cx="256" cy="256" r="232" fill="#C8503C" />
          <circle class="logo-inner" cx="256" cy="256" r="165" fill="#FFF7ED" />
          <g fill="#C8503C" aria-hidden="true">
            <rect x="235" y="74" width="42" height="122" rx="21" transform="rotate(0 256 256)" />
            <rect x="235" y="74" width="42" height="122" rx="21" transform="rotate(45 256 256)" />
            <rect x="235" y="74" width="42" height="122" rx="21" transform="rotate(90 256 256)" />
            <rect x="235" y="74" width="42" height="122" rx="21" transform="rotate(135 256 256)" />
            <rect x="235" y="74" width="42" height="122" rx="21" transform="rotate(180 256 256)" />
            <rect x="235" y="74" width="42" height="122" rx="21" transform="rotate(225 256 256)" />
            <rect x="235" y="74" width="42" height="122" rx="21" transform="rotate(270 256 256)" />
            <rect x="235" y="74" width="42" height="122" rx="21" transform="rotate(315 256 256)" />
          </g>
          <circle cx="256" cy="256" r="66" fill="#C8503C" />
        </svg>
        <span class="logo-name">Rikesh</span>
      </a>
      <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#blog">Blog</a></li>
        <li><a href="#nav-cta">Hire me</a></li>
        <li><a href="#contact">E-mail me</a></li>
        <li>
          <button class="theme-toggle" id="themeToggle" aria-label="Switch to dark mode">
            <span class="sun">☀</span>
            <span class="moon">☾</span>
            <span class="toggle-thumb"></span>
          </button>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div>
        <h1>Rikesh Sharma</h1>
        <h2>Software Engineer</h2>
      </div>
    </section>

    <section id="carrier">carrier</section>
    <section id="skill">skill</section>
    <section id="project">project</section>
    <section id="contact">contact</section>
  </main>
  <footer></footer>
</body>
</html>
